format:
  html:
    theme:
      - United
      - brand
    css: css/styles.css
    toc: true
    title-block-banner-color: white
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          if (window.quartoToggleHeadroom) {
            window.quartoToggleHeadroom();
          }
        });
        </script>
        <script>
        (function () {
          function alignTitle() {
            var content = document.getElementById("quarto-document-content");
            if (!content) return;
            var left = content.getBoundingClientRect().left + window.scrollX +
              parseFloat(getComputedStyle(content).paddingLeft);
            document.documentElement.style.setProperty("--content-left", left + "px");
          }
          alignTitle();
          window.addEventListener("resize", alignTitle);
          window.addEventListener("load", alignTitle);
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(alignTitle);
          }
        })();
        </script>

